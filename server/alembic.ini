# Alembic config for the StepStitch ingest host.
# The DB URL is resolved at runtime by migrations/env.py from the environment
# (DATABASE_URL, falling back to STEPSTITCH_TEST_DATABASE_URL); the placeholder
# below is intentionally inert.
[alembic]
script_location = %(here)s/migrations
sqlalchemy.url = postgresql+psycopg2://localhost/stepstitch

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys_stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
