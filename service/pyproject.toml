[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stepstitch-service"
version = "0.2.0"
description = "StepStitch backend service: deterministic Playwright compiler + decoupled router factory."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104",
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8.0"]

[tool.setuptools]
packages = ["stepstitch_service"]
