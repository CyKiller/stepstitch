version: 2
updates:
  # The SDK (root package.json).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 is the native-port rewrite, not a version bump: it fails the SDK
      # type-check and the executable-repro proof outright. Migrating is its own piece of
      # work, and until it is scheduled a weekly PR that can never go green is noise that
      # trains us to ignore dependabot. Minor and patch TS updates still flow.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The marketing site (web/package.json) — its own lockfile, its own dependency tree.
  # It was not covered here at all, so Next, React and everything under them went
  # unwatched, security advisories included.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignores are per-ecosystem, not per-repo. The TypeScript-major ignore added with this
      # entry covered the ROOT npm package only, so dependabot immediately re-raised the same
      # failing bump here as #64. Both majors below are blocked upstream, not by our code:
      #
      #   typescript 7 — the native-port rewrite; fails the web type-check outright (#58, #64)
      #   eslint 10    — dies inside eslint-config-next, which bundles an eslint-plugin-react
      #                  calling the removed `contextOrFilename.getFilename` API (#63)
      #
      # Both have tracking issues so these ignores are removed deliberately rather than
      # forgotten. Minor and patch updates keep flowing for both packages.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
