name: clean install

# The quickstart's core claim is "every command works, in the order shown, on a clean
# machine". This workflow is that claim, executed. Nothing here reuses the repository's
# node_modules or an activated virtualenv: the SDK is consumed from a packed tarball in a
# fresh project, the service is installed into a fresh venv at the documented minimum
# Python, and doctor runs inside the Compose container exactly as documented.
# (README <-> website command parity is enforced separately by
# web/tests/quickstart-parity.test.ts in the ci.yml web job.)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: clean-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-tarball:
    name: SDK from a packed tarball (ESM + CJS + types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Build tools are allowed here — a publisher has them. The CONSUMER project below
      # gets only the tarball, like a real npm install.
      - name: Pack the SDK
        run: |
          npm ci
          npm pack
          mv stepstitch-tracker-*.tgz /tmp/tracker.tgz
      - name: Install the tarball into a fresh project
        run: |
          mkdir /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install /tmp/tracker.tgz typescript@5
      - name: ESM import works
        run: |
          cd /tmp/consumer
          cat > esm.mjs <<'EOF'
          import { StepStitchTracker, SDK_VERSION } from "@stepstitch/tracker";
          if (typeof StepStitchTracker !== "function") throw new Error("ESM: StepStitchTracker missing");
          if (!SDK_VERSION) throw new Error("ESM: SDK_VERSION missing");
          console.log("ESM OK", SDK_VERSION);
          EOF
          node esm.mjs
      - name: CommonJS require works
        run: |
          cd /tmp/consumer
          cat > cjs.cjs <<'EOF'
          const { StepStitchTracker, SDK_VERSION } = require("@stepstitch/tracker");
          if (typeof StepStitchTracker !== "function") throw new Error("CJS: StepStitchTracker missing");
          console.log("CJS OK", SDK_VERSION);
          EOF
          node cjs.cjs
      - name: TypeScript declarations resolve
        run: |
          cd /tmp/consumer
          cat > consumer.ts <<'EOF'
          import { StepStitchTracker, SDK_VERSION } from "@stepstitch/tracker";
          const version: string = SDK_VERSION;
          export { StepStitchTracker, version };
          EOF
          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "module": "node16",
              "moduleResolution": "node16",
              "strict": true,
              "noEmit": true
            },
            "include": ["consumer.ts"]
          }
          EOF
          npx tsc -p tsconfig.json

  python-clean:
    name: Service in a fresh venv at the documented floor (3.10) + doctor masking
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The docs say "Python 3.10+", so the gate runs at exactly 3.10.
          python-version: "3.10"
      - name: Documented offline sequence, verbatim order
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install ./service
          npm run demo
          npm run smoke
      - name: doctor with no configuration exits 1 with valid JSON
        run: |
          source .venv/bin/activate
          set +e
          stepstitch doctor --json > /tmp/doctor-bare.json
          code=$?
          set -e
          [ "$code" = "1" ] || { echo "::error::doctor with nothing configured should exit 1, got $code"; exit 1; }
          python3 -c "import json; json.load(open('/tmp/doctor-bare.json')); print('valid JSON')"
      - name: doctor never prints a secret value
        env:
          # Planted canaries. If any of these VALUES appears in doctor's output, the
          # masking contract is broken and this job fails.
          STEPSTITCH_INGEST_TOKEN: leaktest-ingest-c4n4ry-1a2b3c
          STEPSTITCH_ADMIN_TOKEN: leaktest-admin-c4n4ry-9z8y7x
          DATABASE_URL: postgres://user:leaktest-pass-c4n4ry@nowhere.invalid:5432/db
        run: |
          source .venv/bin/activate
          set +e
          stepstitch doctor > /tmp/doctor-human.txt 2>&1
          stepstitch doctor --json > /tmp/doctor-json.txt 2>&1
          set -e
          for canary in "leaktest-ingest-c4n4ry-1a2b3c" "leaktest-admin-c4n4ry-9z8y7x" "leaktest-pass-c4n4ry"; do
            if grep -q "$canary" /tmp/doctor-human.txt /tmp/doctor-json.txt; then
              echo "::error::doctor printed a secret value ($canary)"; exit 1
            fi
          done
          echo "no canary leaked"

  manual-host:
    name: manual path (two terminals) against Postgres 16, as documented
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The docs describe two interactive terminals. Each `run:` step below is its own
    # fresh shell, which is exactly the property that makes the second terminal
    # necessary — so step 1 is Terminal 1 and step 2 is Terminal 2, verbatim except:
    # uvicorn is backgrounded with a readiness poll (CI's stand-in for "leave this
    # terminal open"), and DATABASE_URL points at the job's own Postgres service — the
    # docs likewise require a Postgres the user provides. The interactive ergonomics of
    # two real terminals are the only part not executed here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stepstitch
          POSTGRES_PASSWORD: stepstitch
          POSTGRES_DB: stepstitch
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U stepstitch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Terminal 1 — install, configure, run the host
        run: |
          python3 -m venv .venv && source .venv/bin/activate
          pip install ./service
          pip install -r server/requirements.txt
          export DATABASE_URL=postgres://stepstitch:stepstitch@localhost:5432/stepstitch
          export STEPSTITCH_INGEST_TOKEN=dev-ingest
          export STEPSTITCH_ADMIN_TOKEN=dev-admin
          export STEPSTITCH_APP_BASE_URL=https://staging.your-app.example
          nohup uvicorn server.app:app --port 8000 > /tmp/uvicorn.log 2>&1 &
          deadline=$((SECONDS + 60))
          until curl -sf http://localhost:8000/healthz >/dev/null; do
            [ $SECONDS -lt $deadline ] || { echo "::error::host never became healthy"; tail -50 /tmp/uvicorn.log; exit 1; }
            sleep 2
          done
      - name: Terminal 2 — a fresh shell rebuilds doctor's environment and runs it
        run: |
          source .venv/bin/activate
          export DATABASE_URL=postgres://stepstitch:stepstitch@localhost:5432/stepstitch
          export STEPSTITCH_INGEST_TOKEN=dev-ingest
          export STEPSTITCH_ADMIN_TOKEN=dev-admin
          export STEPSTITCH_APP_BASE_URL=https://staging.your-app.example
          stepstitch doctor

  docker-doctor:
    name: doctor inside the Compose container, as documented
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Bring up the documented stack
        run: docker compose up --build -d
      - name: Wait for the host
        run: |
          deadline=$((SECONDS + 180))
          until curl -sf http://localhost:8000/healthz >/dev/null; do
            [ $SECONDS -lt $deadline ] || { echo "::error::host never became healthy"; docker compose logs --tail 50 stepstitch; exit 1; }
            sleep 3
          done
      - name: Run the documented doctor command
        run: |
          docker compose exec -T stepstitch stepstitch doctor | tee /tmp/doctor.txt
      - name: Doctor saw the stack and masked the dev tokens
        run: |
          grep -q "host reachable" /tmp/doctor.txt
          grep -q "database reachable" /tmp/doctor.txt
          # The compose dev token VALUES must never appear; doctor prints hashes only.
          if grep -qE "dev-ingest|dev-admin" /tmp/doctor.txt; then
            echo "::error::doctor printed a token value"; exit 1
          fi
      - name: Tear down
        if: always()
        run: docker compose down -v

  first-run:
    name: npx stepstitch start -> dashboard + connected app, on a clean machine
    # Phase 1's whole promise, executed: one command on a machine that has only Node,
    # then a report from a real app shows up in the console. No repo venv, no Postgres,
    # no Docker, no manually-handled token. Runs on all three OSes because "clean
    # machine" cannot mean "clean Linux".
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: npx stepstitch start (the shim bootstraps uv and the engine)
        shell: bash
        env:
          # The published wheel predates the console script; test the checkout until the
          # next service release (see docs/installer-decision.md).
          STEPSTITCH_SERVICE_SPEC: ./service[local]
          STEPSTITCH_AUTO_INSTALL: "1"
          # Pinned so the job can talk to the host; `start` generates these when unset.
          STEPSTITCH_ADMIN_TOKEN: ci-admin-token
          STEPSTITCH_INGEST_TOKEN: ci-ingest-token
          RETENTION_PURGE_INTERVAL_SECONDS: "0"
        run: |
          node packages/cli-shim/bin/stepstitch.js start \
            --no-browser --port 8321 --db "$RUNNER_TEMP/local.db" > /tmp/start.log 2>&1 &
          echo $! > /tmp/start.pid
          deadline=$((SECONDS + 240))
          until curl -sf http://127.0.0.1:8321/healthz >/dev/null; do
            [ $SECONDS -lt $deadline ] || { echo "::error::start never became healthy"; cat /tmp/start.log; exit 1; }
            sleep 2
          done
          cat /tmp/start.log

      - name: The dashboard serves, with the pairing link that avoids token pasting
        shell: bash
        run: |
          curl -sf http://127.0.0.1:8321/dashboard -o /tmp/dashboard.html
          grep -q "#ss=" /tmp/dashboard.html
          grep -q "Connect your app" /tmp/dashboard.html

      - name: A report from "my app" arrives and is visible in the console
        shell: bash
        run: |
          curl -sf -X POST http://127.0.0.1:8321/api/stepstitch/v1/session \
            -H "Authorization: Bearer ci-ingest-token" \
            -H "Content-Type: application/json" \
            -d '{"app_id":"my-app","explanation":"Transfer did nothing","footsteps":[{"timestamp":"2026-07-30T12:00:00.000Z","type":"navigation","route":"/transfer","label":"[masked]"},{"timestamp":"2026-07-30T12:00:04.000Z","type":"api_error","route":"/transfer","label":"[masked]","metadata":{"status":500,"method":"POST","endpoint":"/api/transfer"}}],"metadata":{"sdk_version":"ci"}}' \
            -o /tmp/ingest.json
          grep -q '"trace_id"' /tmp/ingest.json
          # The connection check's question: a report from something other than the sample.
          curl -sf "http://127.0.0.1:8321/api/stepstitch/v1/sessions?limit=50" \
            -H "Authorization: Bearer ci-admin-token" -o /tmp/sessions.json
          grep -q '"my-app"' /tmp/sessions.json
          # And the console can hand the developer a ready-to-paste snippet.
          curl -sf http://127.0.0.1:8321/admin/status \
            -H "Authorization: Bearer ci-admin-token" -o /tmp/status.json
          grep -q '"local_mode":true' /tmp/status.json

      - name: The local store is a plain file — no database was ever installed
        shell: bash
        run: test -f "$RUNNER_TEMP/local.db"

      - name: Stop the server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/start.pid)" 2>/dev/null || true
