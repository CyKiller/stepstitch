name: StepStitch CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sdk:
    name: SDK (type-check + redaction-proof tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
      - name: Install (runs prepare/build)
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Unit + redaction-proof suite
        run: npm test
      - name: Audit runtime deps (zero-dep invariant -> must stay clean)
        run: npm audit --omit=dev --audit-level=high

  service:
    name: Service (compiler + router)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install service with test + lint extras
        run: pip install "./service[test,lint]"
      - name: Run service tests
        run: pytest service/tests -q
      - name: Layering boundary (import-linter contract)
        working-directory: service
        run: lint-imports
      - name: Lint (ruff) — informational
        continue-on-error: true
        run: |
          pip install ruff
          ruff check service/stepstitch_service
      - name: Dependency audit (pip-audit) — informational
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r <(pip freeze) || true

  e2e-proof:
    name: E2E (compiler output executes in Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove generated reproduction executes
        run: npm run test:e2e-proof
