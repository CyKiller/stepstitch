name: StepStitch CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Callable as a unit so release.yml can run the full gate set via one reusable
  # `uses: ./.github/workflows/ci.yml` — no gate duplication, no drift by construction.
  workflow_call:

jobs:
  sdk:
    name: SDK (type-check + redaction-proof tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # vitest 4 (rolldown) needs node:util styleText, added in Node 20.12. The published
          # SDK still targets node >=18.18 (its engines claim); this only affects the dev/test run.
          node-version: "20"
          cache: "npm"
      - name: Install (runs prepare/build)
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Unit + redaction-proof suite
        run: npm test
      - name: Audit runtime deps (zero-dep invariant -> must stay clean)
        run: npm audit --omit=dev --audit-level=high

  web:
    name: Web (lint + type-check + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint (eslint)
        working-directory: web
        run: npm run lint
      - name: Type-check
        working-directory: web
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        working-directory: web
        run: npm test
      - name: Build (Next.js)
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  service:
    name: Service (compiler + router)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
      # The `mcp` extra is here so test_mcp_stdio.py actually RUNS: it spawns the server
      # and speaks real MCP to it. Without the extra the test skips, and a transport that
      # no client could talk to would ship green.
      - name: Install service with test + lint + mcp extras
        run: pip install "./service[test,lint,mcp]"
      - name: Run service tests
        run: pytest service/tests -q
      - name: Layering boundary (import-linter contract)
        working-directory: service
        run: lint-imports
      - name: Lint (ruff)
        run: ruff check service/stepstitch_service
      - name: Type-check (mypy)
        working-directory: service
        run: mypy stepstitch_service
      - name: Dependency audit (pip-audit) — informational
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r <(pip freeze) || true

  host:
    name: Host (auth + dashboard + real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stepstitch
          POSTGRES_PASSWORD: stepstitch
          POSTGRES_DB: stepstitch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stepstitch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install host + service (with test extras) + lint/type tools
        run: |
          pip install "./service[test]"
          pip install -r server/requirements.txt
          pip install ruff mypy
      # server/ is not covered by the `service` job's ruff/mypy (those are scoped to
      # service/stepstitch_service). Gate it here, where server deps are already installed.
      # ruff resolves config per-file: server/ uses the repo-root pyproject.toml.
      - name: Lint server (ruff)
        run: ruff check server
      - name: Type-check server (mypy)
        run: mypy server
      # Prove migrations apply from an empty database (alembic/psycopg2 come in via
      # server/requirements.txt above).
      - name: Apply migrations (alembic upgrade head)
        working-directory: server
        env:
          DATABASE_URL: postgresql://stepstitch:stepstitch@localhost:5432/stepstitch_ci
        run: alembic upgrade head
      # …and prove the OTHER order: SCHEMA_SQL bootstrap first, THEN alembic replays
      # history on top. That is the fresh-deployment path, it is the order that broke
      # (0009's ADD COLUMN hit DuplicateColumn three jobs wide), and the step above cannot
      # catch it — it proves alembic-onto-empty. Runs on its own disposable database.
      - name: Migrations replay over a SCHEMA_SQL-bootstrapped database
        env:
          DATABASE_URL: postgresql://stepstitch:stepstitch@localhost:5432/stepstitch_ci
        run: python3 scripts/prove_migrations_replay.py
      # Runs the full server/tests suite (auth gating, dashboard XSS regression,
      # observability) AND the real-Postgres round-trip, which is active because the
      # DATABASE_URL below is set (it self-skips elsewhere).
      - name: Host tests + real-Postgres round-trip
        env:
          STEPSTITCH_TEST_DATABASE_URL: postgresql://stepstitch:stepstitch@localhost:5432/stepstitch_ci
        run: pytest server/tests -q

  e2e-proof:
    name: E2E (compiler output executes in Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 for consistency with the sdk/web jobs (vitest 4 needs >=20.12).
          node-version: "20"
          cache: "npm"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: npm ci
      # demo_agent_loop.py starts a real StepStitch host (`stepstitch start`), so this job
      # needs the service and its local-mode server, not just Node.
      - name: Install the service (with the local-mode server)
        run: pip install "./service[local]"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove generated reproduction executes
        run: npm run test:e2e-proof
      # The runner drives real Playwright: red while the fixture is broken, green after it
      # is fixed running the BYTE-IDENTICAL frozen script, and a refusal when the script is
      # edited. The unit tests prove the security properties with a stand-in subprocess;
      # this proves the verdicts match reality.
      - name: Prove the runner is red-to-green and cannot be talked out of it
        run: npm run test:runner-proof
      # The flagship claim, executed: a (deterministic, LLM-free) agent takes a real
      # failure through freeze -> measured red -> patch -> rerun of the FROZEN test ->
      # fixed, and a second agent that edits the test instead of the app gets nowhere.
      - name: Prove the agent loop closes with evidence the agent cannot touch
        run: npm run test:agent-loop
      # Keeps docs/benchmark.md honest: it fails if the compiler ever stops asserting the
      # reported failure, so the published numbers cannot quietly go stale.
      - name: Benchmark (30 failure shapes)
        run: npm run test:benchmark
      # Deep diagnostics must not change what they measure. Tracing adds a browser-level
      # observer to every action; if that shifted a verdict or a failure fingerprint, every
      # verdict StepStitch issues would be quietly corrupted. Real Chromium, twice per
      # shape, on and off.
      - name: Prove diagnostics are inert
        run: npm run test:diagnostics-inert

  demo-console:
    name: Demo console (renders in a real browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # The demo app needs no database and no tokens, which is exactly why it can be
      # exercised here: the console is ~85 KB of inline JS that server-side tests cannot
      # prove renders at all.
      - name: Install the service
        run: pip install "./service" && pip install -r server/requirements.txt
      - name: Install
        run: npm ci
      # demo_agent_loop.py starts a real StepStitch host (`stepstitch start`), so this job
      # needs the service and its local-mode server, not just Node.
      - name: Install the service (with the local-mode server)
        run: pip install "./service[local]"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Demo dataset is not stale
        run: |
          PYTHONPATH=service python3 scripts/build_demo_dataset.py
          git diff --exit-code server/demo_dataset.json
      - name: Drive the demo console
        run: npm run test:demo-console

  tiny-transfer:
    name: Example (TinyTransfer privacy + red-to-green)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
      # The example depends on @stepstitch/tracker at file:../.., and dist/ is produced by
      # the root's prepare script — so the root install has to come first.
      - name: Install the SDK (builds dist/)
        run: npm ci
      - name: Install the example
        working-directory: examples/tiny-transfer
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: examples/tiny-transfer
        run: npx playwright install --with-deps chromium
      # Hermetic: a stub host stands in for StepStitch, so this job needs no Python and no
      # database. The full red-to-green loop against a live host is verify.mjs, run by hand.
      - name: Prove the privacy claims against the captured payload
        working-directory: examples/tiny-transfer
        run: npm run test:e2e

  compliance:
    name: Compliance evidence (no drift)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install service (generator imports it)
        run: pip install ./service
      # Regenerate COMPLIANCE-EVIDENCE.md from source and fail if it drifts from the
      # committed copy. Previously this only ran in release.yml; gating it here means it
      # fires on every PR AND is included when release.yml calls this workflow.
      - name: Compliance evidence has no drift
        run: |
          cp COMPLIANCE-EVIDENCE.md /tmp/ce.md
          PYTHONPATH=service python scripts/generate_compliance_evidence.py
          diff /tmp/ce.md COMPLIANCE-EVIDENCE.md
