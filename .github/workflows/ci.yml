name: StepStitch CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Callable as a unit so release.yml can run the full gate set via one reusable
  # `uses: ./.github/workflows/ci.yml` — no gate duplication, no drift by construction.
  workflow_call:

jobs:
  sdk:
    name: SDK (type-check + redaction-proof tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # vitest 4 (rolldown) needs node:util styleText, added in Node 20.12. The published
          # SDK still targets node >=18.18 (its engines claim); this only affects the dev/test run.
          node-version: "20"
          cache: "npm"
      - name: Install (runs prepare/build)
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Unit + redaction-proof suite
        run: npm test
      - name: Audit runtime deps (zero-dep invariant -> must stay clean)
        run: npm audit --omit=dev --audit-level=high

  web:
    name: Web (lint + type-check + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint (eslint)
        working-directory: web
        run: npm run lint
      - name: Type-check
        working-directory: web
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        working-directory: web
        run: npm test
      - name: Build (Next.js)
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  service:
    name: Service (compiler + router)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install service with test + lint extras
        run: pip install "./service[test,lint]"
      - name: Run service tests
        run: pytest service/tests -q
      - name: Layering boundary (import-linter contract)
        working-directory: service
        run: lint-imports
      - name: Lint (ruff)
        run: ruff check service/stepstitch_service
      - name: Type-check (mypy)
        working-directory: service
        run: mypy stepstitch_service
      - name: Dependency audit (pip-audit) — informational
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r <(pip freeze) || true

  host:
    name: Host (auth + dashboard + real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stepstitch
          POSTGRES_PASSWORD: stepstitch
          POSTGRES_DB: stepstitch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stepstitch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install host + service (with test extras) + lint/type tools
        run: |
          pip install "./service[test]"
          pip install -r server/requirements.txt
          pip install ruff mypy
      # server/ is not covered by the `service` job's ruff/mypy (those are scoped to
      # service/stepstitch_service). Gate it here, where server deps are already installed.
      # ruff resolves config per-file: server/ uses the repo-root pyproject.toml.
      - name: Lint server (ruff)
        run: ruff check server
      - name: Type-check server (mypy)
        run: mypy server
      # Prove migrations apply from an empty database (alembic/psycopg2 come in via
      # server/requirements.txt above).
      - name: Apply migrations (alembic upgrade head)
        working-directory: server
        env:
          DATABASE_URL: postgresql://stepstitch:stepstitch@localhost:5432/stepstitch_ci
        run: alembic upgrade head
      # Runs the full server/tests suite (auth gating, dashboard XSS regression,
      # observability) AND the real-Postgres round-trip, which is active because the
      # DATABASE_URL below is set (it self-skips elsewhere).
      - name: Host tests + real-Postgres round-trip
        env:
          STEPSTITCH_TEST_DATABASE_URL: postgresql://stepstitch:stepstitch@localhost:5432/stepstitch_ci
        run: pytest server/tests -q

  e2e-proof:
    name: E2E (compiler output executes in Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # Node 20 for consistency with the sdk/web jobs (vitest 4 needs >=20.12).
          node-version: "20"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove generated reproduction executes
        run: npm run test:e2e-proof

  compliance:
    name: Compliance evidence (no drift)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install service (generator imports it)
        run: pip install ./service
      # Regenerate COMPLIANCE-EVIDENCE.md from source and fail if it drifts from the
      # committed copy. Previously this only ran in release.yml; gating it here means it
      # fires on every PR AND is included when release.yml calls this workflow.
      - name: Compliance evidence has no drift
        run: |
          cp COMPLIANCE-EVIDENCE.md /tmp/ce.md
          PYTHONPATH=service python scripts/generate_compliance_evidence.py
          diff /tmp/ce.md COMPLIANCE-EVIDENCE.md
