name: release-please

# Opens/maintains a release PR from Conventional Commits, bumping the three version
# locations in lockstep (package.json + src/tracker.ts + service/pyproject.toml) and
# generating CHANGELOG.md. Merging that PR does NOT create a tag or GitHub release
# (skip-github-release): cutting a release is a deliberate human act via the
# release-cut workflow (manual dispatch), and publication additionally waits for
# approval on the protected `release` environment in release.yml. Merging product
# work can never publish anything.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
