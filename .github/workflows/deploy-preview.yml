name: deploy preview

# Deploys each PR to an ephemeral Railway preview environment and comments the URL.
# Skips cleanly if RAILWAY_TOKEN is not configured. (Railway's native GitHub PR
# environments can also be enabled in the dashboard instead of this workflow.)
on:
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Has Railway token?
        id: tok
        run: echo "has=${{ secrets.RAILWAY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Install Railway CLI
        if: steps.tok.outputs.has == 'true'
        run: npm i -g @railway/cli
      - name: Deploy PR preview
        if: steps.tok.outputs.has == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: railway up --ci --service stepstitch-api --environment "pr-${PR}"
      - name: Comment preview info
        if: steps.tok.outputs.has == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🚀 Preview deployed to Railway environment `pr-${{ github.event.pull_request.number }}`.
            Check the Railway dashboard for the generated URL.
      - name: Note (token missing)
        if: steps.tok.outputs.has != 'true'
        run: echo "RAILWAY_TOKEN not set — skipping preview deploy."
