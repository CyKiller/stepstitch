name: release (publish on tag)

# Triggered by the version tag release-please creates on merge. The `verify` job runs the
# FULL CI gate set by calling .github/workflows/ci.yml as a reusable workflow (same jobs as
# a PR — sdk/web/service/host/e2e-proof/compliance), so a release can never publish past a
# gate that CI would fail. Only after those gates pass does it publish npm + PyPI + Docker
# (GHCR, multi-arch) and attach SBOM + SRI to the release. Token-gated steps skip cleanly
# when their secret is not configured, so a tag never hard-fails a half-configured project.
on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: write      # upload release assets
  id-token: write      # npm provenance / PyPI trusted publishing (OIDC)
  packages: write      # push images to GHCR

jobs:
  # Run the entire CI workflow as the release gate. This is the single source of truth for
  # "what must pass" — adding/removing a gate in ci.yml automatically applies here too, so
  # release gates can never drift from PR gates. CI's jobs use no secrets (the host job's
  # Postgres is a self-contained service container), so `secrets: inherit` is not needed.
  verify:
    uses: ./.github/workflows/ci.yml

  npm:
    name: publish npm + release assets
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Node 20 for consistency with CI (publish job runs tsc-only `npm run release`).
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Build + stamp + SBOM
        run: npm run release
      - name: Compute SRI hash
        run: |
          SRI="sha384-$(cat dist/index.js | openssl dgst -sha384 -binary | openssl base64 -A)"
          echo "$SRI" > dist/index.js.sri
          echo "SRI=$SRI" >> "$GITHUB_ENV"
      - name: Has NPM token?
        id: tok
        run: echo "has=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Publish to npm (provenance)
        if: steps.tok.outputs.has == 'true'
        # Idempotent: skip cleanly if this version is already on npm so a re-run
        # of an existing tag does not hard-fail with E403 "cannot publish over".
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@stepstitch/tracker@${VERSION}" version >/dev/null 2>&1; then
            echo "npm: @stepstitch/tracker@${VERSION} already published — skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Attach SBOM + SRI to the GitHub release
        run: gh release upload "${GITHUB_REF_NAME}" sbom.cdx.json dist/index.js.sri --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    name: publish PyPI
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.11" }
      - run: pip install build
      - run: python -m build ./service --outdir dist
      - name: Has PyPI token?
        id: tok
        run: echo "has=${{ secrets.PYPI_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Publish to PyPI
        if: steps.tok.outputs.has == 'true'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          skip-existing: true

  docker:
    name: build + push images (GHCR, multi-arch)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Compute version + lowercase owner
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Ingest API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/stepstitch-api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/stepstitch-api:latest
      - name: MCP connector image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: service
          file: service/Dockerfile.mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/stepstitch-mcp:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/stepstitch-mcp:latest
