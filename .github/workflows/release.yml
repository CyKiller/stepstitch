name: release (publish on tag)

# Runs for a version tag (cut manually via release-cut.yml — release-please no longer
# tags) or a manual dispatch. The `verify` job runs the FULL CI gate set by calling
# .github/workflows/ci.yml as a reusable workflow (same jobs as a PR — sdk/web/service/
# host/e2e-proof/compliance), so a release can never publish past a gate that CI would
# fail. The publish jobs additionally sit behind the protected `release` environment:
# nothing reaches npm/PyPI/GHCR until CyKiller approves the parked run, no matter how
# the workflow was triggered. Token-gated steps skip cleanly when their secret is not
# configured, so a tag never hard-fails a half-configured project.
#
# Identity invariant (guarded by service/tests/test_release_workflow_identity.py): the
# `identity` job resolves the requested version to the TAG'S peeled commit and proves
# every version manifest at that commit agrees; every publish job checks out exactly that
# commit and re-asserts it. Before this, a dispatch from main checked out main's HEAD —
# so anything merged after the tag would have published under the tagged version, and
# environment approval could not have told the difference. The workflow DEFINITION still
# runs from main on a dispatch (deliberate: a fix to this file must apply to the run
# shipping it); only the source being built is pinned.
on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to publish/verify (e.g. 0.9.0). Lets a dispatch run from MAIN use the
          current workflow definition while still targeting a released version — a
          dispatch on the tag itself runs the workflow AS OF that tag, which is exactly
          wrong when the fix being shipped is to this file.
        required: false
        type: string

permissions:
  contents: write      # upload release assets
  id-token: write      # npm provenance / PyPI trusted publishing (OIDC)
  packages: write      # push images to GHCR

jobs:
  # Run the entire CI workflow as the release gate. This is the single source of truth for
  # "what must pass" — adding/removing a gate in ci.yml automatically applies here too, so
  # release gates can never drift from PR gates. CI's jobs use no secrets (the host job's
  # Postgres is a self-contained service container), so `secrets: inherit` is not needed.
  verify:
    uses: ./.github/workflows/ci.yml

  identity:
    name: requested version == tag == source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pin.outputs.version }}
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the tag and its history, not just the triggering ref
      - name: Resolve the version to the tag's commit and hold it to its manifests
        id: pin
        run: |
          RAW="${{ inputs.version || github.ref_name }}"
          VERSION="${RAW#v}"
          # Peel (^{commit}): the tag's TARGET commit, whether the tag is lightweight or
          # annotated — never the tag object itself, and never whatever HEAD happens to be.
          SHA="$(git rev-parse -q --verify "refs/tags/v${VERSION}^{commit}")" || {
            echo "::error::tag v${VERSION} does not exist — cut it with release-cut.yml first."
            exit 1
          }
          git checkout --quiet "$SHA"
          for probe in \
            "node -p require('./package.json').version" \
            "node -p require('./packages/cli-shim/package.json').version"; do
            GOT="$($probe)"
            if [ "$GOT" != "$VERSION" ]; then
              echo "::error::at tag v${VERSION} (${SHA}) a manifest says ${GOT} — refusing to publish a version the source does not declare."
              exit 1
            fi
          done
          grep -q "^version = \"${VERSION}\"" service/pyproject.toml || {
            echo "::error::service/pyproject.toml at tag v${VERSION} disagrees with ${VERSION}"
            exit 1
          }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "## Release identity"
            echo "- **Version:** ${VERSION}"
            echo "- **Tag commit:** ${SHA}"
            echo "- All publish jobs build exactly this commit."
          } >> "$GITHUB_STEP_SUMMARY"

  npm:
    name: publish npm + release assets
    needs: [verify, identity]
    # Publication requires human approval on the protected `release` environment —
    # a tag alone (however it was created) parks here until CyKiller approves.
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.sha }}
      - name: This checkout is the tagged commit, not the workflow's ref
        run: test "$(git rev-parse HEAD)" = "${{ needs.identity.outputs.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 for consistency with CI (publish job runs tsc-only `npm run release`).
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Build + stamp + SBOM
        run: npm run release
      - name: Compute SRI hash
        run: |
          SRI="sha384-$(cat dist/index.js | openssl dgst -sha384 -binary | openssl base64 -A)"
          echo "$SRI" > dist/index.js.sri
          echo "SRI=$SRI" >> "$GITHUB_ENV"
      - name: Has NPM token?
        id: tok
        run: echo "has=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Publish to npm (provenance)
        if: steps.tok.outputs.has == 'true'
        # Idempotent: skip cleanly if this version is already on npm so a re-run
        # of an existing tag does not hard-fail with E403 "cannot publish over".
        run: |
          VERSION="${{ needs.identity.outputs.version }}"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          if npm view "@stepstitch/tracker@${VERSION}" version >/dev/null 2>&1; then
            echo "npm: @stepstitch/tracker@${VERSION} already published — skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish the launcher shim to npm (provenance)
        if: steps.tok.outputs.has == 'true'
        # The package `npx stepstitch start` actually installs. It sat unpublished
        # through 0.9.0's first dispatch — the first-run CI gate exercises a local
        # `npm pack` of it, so nothing ever noticed the registry 404 until a
        # stranger-verification ran against the real registry. Same idempotent
        # guard as the tracker: re-running a tag must not hard-fail.
        working-directory: packages/cli-shim
        run: |
          VERSION="${{ needs.identity.outputs.version }}"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          if npm view "stepstitch@${VERSION}" version >/dev/null 2>&1; then
            echo "npm: stepstitch@${VERSION} already published — skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach SBOM + SRI to the GitHub release
        run: |
          gh release upload "v${{ needs.identity.outputs.version }}" \
            sbom.cdx.json dist/index.js.sri --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    name: publish PyPI
    needs: [verify, identity]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.sha }}
      - name: This checkout is the tagged commit, not the workflow's ref
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.identity.outputs.sha }}"
          grep -q "^version = \"${{ needs.identity.outputs.version }}\"" service/pyproject.toml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11" }
      - run: pip install build
      - run: python -m build ./service --outdir dist
      - name: Has PyPI token?
        id: tok
        run: echo "has=${{ secrets.PYPI_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Publish to PyPI
        if: steps.tok.outputs.has == 'true'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          skip-existing: true

  installable:
    name: a stranger can install what we just published
    needs: [npm, pypi, identity]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: "20"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Deliberately NO checkout: this job impersonates a stranger with an empty machine.
      # The first-run gate exercises a local `npm pack` of the shim, which is how
      # `stepstitch` sat unpublished on the registry through a whole release with every
      # check green. Only an install from the real registry proves what a launch claims.
      #
      # Propagation, not correctness, is what makes this job flaky: a package is live at
      # the registry API minutes before every CDN edge and every client cache agrees. So
      # each wait polls the registry's HTTP API (authoritative, uncacheable by us) and only
      # then runs the real client with its caches disabled. Getting this wrong once already
      # failed a release whose artifacts were perfectly fine, which is worse than useless —
      # a check that cries wolf is a check people learn to skip.
      - name: Wait for both registries to serve the new version
        run: |
          VERSION="${{ needs.identity.outputs.version }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          wait_for () {   # $1 human name, $2 url, $3 jq-ish grep for the version
            for i in $(seq 1 60); do
              if curl -fsSL "$2" | grep -q "\"$VERSION\""; then
                echo "$1 is serving ${VERSION} (after $((i*10))s)"; return 0
              fi
              sleep 10
            done
            echo "::error::$1 never served ${VERSION} within 10 minutes"; return 1
          }
          wait_for "npm (stepstitch)" \
            "https://registry.npmjs.org/stepstitch" "$VERSION"
          wait_for "PyPI (stepstitch-service)" \
            "https://pypi.org/pypi/stepstitch-service/json" "$VERSION"
      - name: The engine installs from PyPI and answers
        # --refresh so uv consults the index rather than a warm local cache.
        run: |
          pip install -q uv
          uvx --refresh --from "stepstitch-service==${VERSION}" stepstitch --help
      - name: npx stepstitch start serves a stranger
        env:
          STEPSTITCH_ADMIN_TOKEN: stranger-admin
          STEPSTITCH_INGEST_TOKEN: stranger-ingest
        run: |
          npm cache clean --force || true
          npx -y "stepstitch@${VERSION}" start --no-browser --port 8471 --db /tmp/s.db &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8471/healthz >/dev/null; then
              echo "healthy after $((i*2))s"; break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8471/healthz >/dev/null || {
            echo "::error::npx stepstitch@${VERSION} start never became healthy"; exit 1; }
          # Health alone only proves a process bound a port. Ingest proves the product.
          TRACE=$(curl -s -X POST http://127.0.0.1:8471/api/stepstitch/v1/session \
            -H "Authorization: Bearer stranger-ingest" -H "Content-Type: application/json" \
            -d '{"app_id":"stranger","footsteps":[{"timestamp":"t","type":"exception","route":"/x","label":"[masked]","metadata":{"error_type":"TypeError"}}],"metadata":{}}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('trace_id',''))")
          test -n "$TRACE" || { echo "::error::ingest returned no trace_id"; exit 1; }
          echo "a stranger ingested ${TRACE} on the published build"

  docker:
    name: build + push images (GHCR, multi-arch)
    needs: [verify, identity]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.sha }}
      - name: This checkout is the tagged commit, not the workflow's ref
        run: test "$(git rev-parse HEAD)" = "${{ needs.identity.outputs.sha }}"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Compute version + lowercase owner
        id: meta
        run: |
          echo "version=${{ needs.identity.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Ingest API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/stepstitch-api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/stepstitch-api:latest
      - name: MCP connector image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: service
          file: service/Dockerfile.mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/stepstitch-mcp:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/stepstitch-mcp:latest
