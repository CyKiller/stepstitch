name: release (publish on tag)

# Triggered by the version tag release-please creates on merge. Runs all gates, then
# publishes npm + PyPI + Docker (GHCR, multi-arch) and attaches SBOM + SRI to the release.
# Token-gated steps skip cleanly when their secret is not configured, so a tag never
# hard-fails a half-configured project.
on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: write      # upload release assets
  id-token: write      # npm provenance / PyPI trusted publishing (OIDC)
  packages: write      # push images to GHCR

jobs:
  verify:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "18", cache: "npm" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e-proof
      - run: pip install "./service[test,lint,mcp]"
      - run: pytest service/tests -q
      - name: Compliance evidence has no drift
        run: |
          cp COMPLIANCE-EVIDENCE.md /tmp/ce.md
          PYTHONPATH=service python scripts/generate_compliance_evidence.py
          diff /tmp/ce.md COMPLIANCE-EVIDENCE.md

  npm:
    name: publish npm + release assets
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Build + stamp + SBOM
        run: npm run release
      - name: Compute SRI hash
        run: |
          SRI="sha384-$(cat dist/index.js | openssl dgst -sha384 -binary | openssl base64 -A)"
          echo "$SRI" > dist/index.js.sri
          echo "SRI=$SRI" >> "$GITHUB_ENV"
      - name: Has NPM token?
        id: tok
        run: echo "has=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Publish to npm (provenance)
        if: steps.tok.outputs.has == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Attach SBOM + SRI to the GitHub release
        run: gh release upload "${GITHUB_REF_NAME}" sbom.cdx.json dist/index.js.sri --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    name: publish PyPI
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install build
      - run: python -m build ./service --outdir dist
      - name: Has PyPI token?
        id: tok
        run: echo "has=${{ secrets.PYPI_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Publish to PyPI
        if: steps.tok.outputs.has == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist

  docker:
    name: build + push images (GHCR, multi-arch)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Compute version + lowercase owner
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Ingest API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/stepstitch-api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/stepstitch-api:latest
      - name: MCP connector image
        uses: docker/build-push-action@v6
        with:
          context: service
          file: service/Dockerfile.mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/stepstitch-mcp:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/stepstitch-mcp:latest
