name: deploy staging

# Deploys main to a persistent Railway "staging" service (separate from the live
# production service). Skips cleanly if RAILWAY_TOKEN is not configured.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Has Railway token?
        id: tok
        run: echo "has=${{ secrets.RAILWAY_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Install Railway CLI
        if: steps.tok.outputs.has == 'true'
        run: npm i -g @railway/cli
      - name: Deploy to staging
        if: steps.tok.outputs.has == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service stepstitch-api --environment staging
      - name: Note (token missing)
        if: steps.tok.outputs.has != 'true'
        run: echo "RAILWAY_TOKEN not set — skipping staging deploy."
