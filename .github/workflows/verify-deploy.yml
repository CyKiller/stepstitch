name: verify production deploy

# Deployment ownership, stated plainly: Railway's native GitHub integration deploys main
# to the production service (stepstitch-api), and Vercel's native Git integration deploys
# web/ to stepstitch.vercel.app. This workflow deploys NOTHING. It replaces the old
# deploy-staging / deploy-preview workflows, which skipped every step when RAILWAY_TOKEN
# was unset and still concluded success — a green check that deployed nothing and verified
# nothing. This one verifies the deployment the native integrations made, and goes red
# when the public product proof is broken, which is the honest signal.
#
# There is deliberately no soft path: if /healthz cannot prove it is serving THIS commit
# (unreachable host, malformed JSON, missing revision, "unknown", or a different SHA),
# the job fails. A deployment that cannot be identified is not a verified deployment.
#
# Everything checked here is public and credential-free; no secret is read or printed.
# Guarded by service/tests/test_verify_deploy_workflow.py.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-deploy
  cancel-in-progress: true

env:
  RAILWAY_HOST: https://stepstitch-api-production.up.railway.app
  SITE: https://stepstitch.vercel.app

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Railway serves exactly this commit
        id: revision
        run: |
          # Railway builds on its own schedule after the push; poll /healthz until the
          # reported revision EXACTLY equals this commit. Every unconfirmed state —
          # unreachable host, malformed JSON, missing revision, "unknown", a different
          # SHA — keeps polling, and hitting the deadline fails the job. Never a
          # soft-pass: a 200 from a build we cannot identify proves nothing.
          want="${GITHUB_SHA}"
          deadline=$((SECONDS + 600))
          observed="never-reached"
          while [ $SECONDS -lt $deadline ]; do
            if body=$(curl -sfS --max-time 15 "$RAILWAY_HOST/healthz" 2>/dev/null); then
              if rev=$(printf '%s' "$body" | jq -er '.revision' 2>/dev/null); then
                observed="$rev"
              else
                observed="malformed-or-missing-revision"
              fi
            else
              observed="unreachable"
            fi
            if [ "$observed" = "$want" ]; then
              echo "observed=$observed" >> "$GITHUB_OUTPUT"
              echo "confirmed=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "observed=$observed" >> "$GITHUB_OUTPUT"
          echo "confirmed=no" >> "$GITHUB_OUTPUT"
          echo "::error::Railway never confirmed revision '$want' before the deadline (last observed: '$observed'). A stale or unidentifiable deployment is a failure, not a warning."
          exit 1

      - name: Railway public contract
        id: railway
        # continue-on-error so the Vercel contract still runs and reports; the gate step
        # below turns any contract failure into a job failure.
        continue-on-error: true
        run: |
          # probe METHOD URL EXPECTED_STATUS [REQUIRED_TEXT] — bounded retries, arguments
          # individually quoted end to end (never a word-split command string).
          probe() {
            method="$1"; url="$2"; want="$3"; text="${4:-}"
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS --max-time 20 -X "$method" -o /tmp/probe-body -w "%{http_code}" "$url" 2>/dev/null) || code="000"
              if [ "$code" = "$want" ]; then
                if [ -z "$text" ] || grep -q "$text" /tmp/probe-body; then
                  echo "ok: $method $url -> $code"
                  return 0
                fi
              fi
              sleep 10
            done
            echo "::error::$method $url returned '$code' (expected $want${text:+ with text \"$text\"})"
            return 1
          }
          probe GET  "$RAILWAY_HOST/demo/dashboard" 200 "Synthetic demo"
          probe GET  "$RAILWAY_HOST/demo/api/stepstitch/v1/sessions?limit=1" 200
          probe POST "$RAILWAY_HOST/demo/api/stepstitch/v1/session/probe/verify" 403
          probe PUT  "$RAILWAY_HOST/demo/admin/config/repro" 403

      - name: Vercel public contract
        id: vercel
        continue-on-error: true
        run: |
          probe() {
            method="$1"; url="$2"; want="$3"; text="${4:-}"
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS --max-time 20 -X "$method" -o /tmp/probe-body -w "%{http_code}" "$url" 2>/dev/null) || code="000"
              if [ "$code" = "$want" ]; then
                if [ -z "$text" ] || grep -q "$text" /tmp/probe-body; then
                  echo "ok: $method $url -> $code"
                  return 0
                fi
              fi
              sleep 10
            done
            echo "::error::$method $url returned '$code' (expected $want${text:+ with text \"$text\"})"
            return 1
          }
          probe GET  "$SITE/dashboard/demo" 200 "Synthetic demo"
          probe GET  "$SITE/dashboard/demo/api/stepstitch/v1/sessions?limit=1" 200
          probe POST "$SITE/dashboard/demo/api/stepstitch/v1/session/probe/verify" 403
          probe PUT  "$SITE/dashboard/demo/admin/config/repro" 403

      - name: Gate on both contracts
        run: |
          railway="${{ steps.railway.outcome }}"
          vercel="${{ steps.vercel.outcome }}"
          echo "railway=$railway vercel=$vercel"
          [ "$railway" = "success" ] && [ "$vercel" = "success" ] || {
            echo "::error::public contract failed (railway=$railway, vercel=$vercel)"
            exit 1
          }

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Production deploy verification"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Expected SHA | \`${GITHUB_SHA}\` |"
            echo "| Observed revision | \`${{ steps.revision.outputs.observed || 'step did not run' }}\` |"
            echo "| Exact revision confirmed | ${{ steps.revision.outputs.confirmed || 'no' }} |"
            echo "| Railway contract ($RAILWAY_HOST) | ${{ steps.railway.outcome }} |"
            echo "| Vercel contract ($SITE) | ${{ steps.vercel.outcome }} |"
            echo ""
            echo "Deploys are made by the native Railway and Vercel Git integrations; this workflow only verifies them."
          } >> "$GITHUB_STEP_SUMMARY"
