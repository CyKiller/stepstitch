name: Feature request
description: Suggest an enhancement or a new connector
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - New connector / adapter
        - SDK capability
        - Service / API capability
        - Agent / MCP surface
        - DevOps / tooling
        - Docs
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy considerations
      description: >
        Does this touch capture, scrubbing, drafts, or the agent surface? How does it
        preserve the no-NPI guarantee?
